<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1e2b">
<title>تماس و چت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--night:#0f1e2b;--deep:#16293a;--lift:#24394b;--lake:#2ec4b6;--sun:#ffb454;--mist:#eaf1f5;--mute:#8aa0b2;--danger:#ef5b5b}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{height:100vh;height:100dvh;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--night);color:var(--mist);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Join ---------- */
#join{height:100%;overflow:auto;display:grid;place-items:center;padding:20px;
  background:radial-gradient(60% 50% at 85% 8%,rgba(46,196,182,.30),transparent 70%),radial-gradient(50% 45% at 8% 95%,rgba(255,180,84,.22),transparent 70%),var(--night)}
.wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center;max-width:940px;width:100%}
.hero h1{font-size:clamp(1.9rem,4.6vw,3.3rem);font-weight:800;line-height:1.4}
.hero p{margin-top:14px;color:var(--mute);font-size:1.05rem;max-width:30ch;line-height:1.9}
.faces{display:flex;margin-top:28px}
.faces i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:1.2rem;color:var(--night);border:3px solid var(--night);margin-inline-start:-12px}
.faces i:first-child{margin-inline-start:0}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:26px;backdrop-filter:blur(14px)}
.card label{display:block;margin:0 0 6px;font-size:.9rem;color:var(--mute)}
.card input[type=text]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);margin-bottom:16px}
.card input[type=text]::placeholder{color:#5f7587}
.check{display:flex!important;gap:10px;align-items:center;color:var(--mist)!important;font-size:.95rem!important;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--lake)}
.primary{width:100%;margin-top:20px;padding:14px;border-radius:12px;background:var(--lake);color:var(--night);font-weight:800;font-size:1.05rem}
#err{color:#ff9d9d;min-height:1.4em;margin-top:10px;font-size:.9rem}

/* ---------- Call screen ---------- */
#app{display:none;position:fixed;inset:0;background:var(--night)}
#stage{position:absolute;inset:0;transition:inset .2s}
#app.chat-open #stage{inset:0 0 0 340px}
#grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--c,1),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:10px;padding:64px 12px 96px}
.tile{position:relative;min-height:0;border-radius:18px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(160deg,#1c3246,#122232)}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.me video{transform:scaleX(-1)}
.tile .av{width:clamp(64px,16vmin,120px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:clamp(1.6rem,6vmin,2.8rem);color:var(--night)}
.tile.hasvideo .av{display:none}
.tile .nm{position:absolute;bottom:10px;right:10px;background:rgba(15,30,43,.65);backdrop-filter:blur(6px);padding:3px 12px;border-radius:99px;font-size:.82rem}
#grid[data-n="2"]:not(.has-spot) .tile.me{position:absolute;width:112px;height:150px;bottom:104px;left:18px;z-index:3;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2)}
#grid[data-n="2"]:not(.has-spot) .tile.me .nm{display:none}

#top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 16px;z-index:4;background:linear-gradient(rgba(15,30,43,.85),transparent)}
#top .t{flex:1;min-width:0}
#roomTitle{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meta{font-size:.8rem;color:var(--mute)}
.pill{display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:99px;background:var(--lift);font-size:.85rem}
.pill .ic{width:18px;height:18px}

#bar{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:12px;padding:10px 14px;border-radius:99px;background:rgba(22,41,58,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1)}
.rb{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--lift);transition:background .15s}
.rb:hover{background:#2f4a60}
.rb.off{background:var(--mist);color:var(--night)}
.rb .sl{display:none}
.rb.off .sl{display:block}
.rb.leave{background:var(--danger);color:#fff}
.rb.leave .ic{transform:rotate(135deg)}
#badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--sun);color:var(--night);font-size:.72rem;font-weight:800;display:none;place-items:center}

/* tile tools, zoom, spotlight */
.tile video{transition:transform .15s}
.tile .tools{position:absolute;top:8px;left:8px;display:flex;gap:6px;z-index:2;opacity:0;transition:opacity .15s}
.tile:hover .tools,.tile:focus-within .tools,.tile.spot .tools{opacity:1}
@media(hover:none){.tile .tools{opacity:1}}
.tools button{width:34px;height:34px;border-radius:50%;background:rgba(15,30,43,.72);backdrop-filter:blur(6px);display:grid;place-items:center}
.tools button:hover{background:rgba(15,30,43,.95)}
.tools .ic{width:17px;height:17px}
#grid[data-n="2"]:not(.has-spot) .tile.me .tools{display:none}
#grid.has-spot{grid-template-columns:minmax(0,1fr) 200px;grid-template-rows:repeat(var(--o,1),minmax(0,1fr));grid-auto-rows:0}
#grid.has-spot .tile.spot{grid-column:1;grid-row:1 / span var(--o,1)}
#grid.has-spot .tile:not(.spot){grid-column:2}
#grid.has-spot .tile:not(.spot) .tools{display:none}
.tile{cursor:pointer}
#grid.has-spot .tile:not(.spot) .nm{font-size:.7rem;padding:2px 8px;bottom:6px;right:6px}

/* ---------- Chat ---------- */
#chat{position:absolute;top:0;bottom:0;left:0;width:340px;display:none;flex-direction:column;background:var(--deep);border-right:1px solid rgba(255,255,255,.08);z-index:6}
#app.chat-open #chat{display:flex}
#chat header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:800;border-bottom:1px solid rgba(255,255,255,.08)}
#chat header button{background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
#chat header button:hover{background:var(--lift)}
#msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:8px 13px;border-radius:14px 14px 14px 4px;background:var(--lift);overflow-wrap:anywhere;line-height:1.7}
.m b{display:block;font-size:.76rem;color:var(--sun)}
.m.me{align-self:flex-end;background:var(--lake);color:var(--night);border-radius:14px 14px 4px 14px}
.m.me b{display:none}
.sys::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:7px;background:var(--lake)}
.sys.leave::before{background:var(--danger)}
.sys{align-self:center;max-width:95%;text-align:center;color:var(--mute);font-size:.78rem;background:rgba(255,255,255,.06);padding:3px 12px;border-radius:99px}
.empty{margin:auto;color:var(--mute);text-align:center;font-size:.92rem}
#send{display:flex;gap:8px;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08)}
#send input{flex:1;min-width:0;padding:12px 16px;border-radius:99px;border:0;background:var(--lift)}
#send button{width:46px;height:46px;border-radius:50%;background:var(--lake);color:var(--night);display:grid;place-items:center}
#send .ic{transform:scaleX(-1)}

@media(max-width:760px){
  .wrap{grid-template-columns:1fr;gap:20px}
  .hero p,.faces{display:none}
  .hero h1{font-size:1.7rem}
  #app.chat-open #stage{inset:0}
  #chat{top:auto;left:0;right:0;width:auto;height:70%;border-radius:22px 22px 0 0;border:0;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
  #grid{padding:60px 8px 92px;gap:8px}
  #grid[data-n="2"]:not(.has-spot) .tile.me{width:92px;height:124px;bottom:96px;left:12px}
  .rb{width:48px;height:48px}
  #bar{gap:10px}
  .pill span{display:none}
}
@media(max-width:760px){
  #grid.has-spot{grid-template-columns:repeat(var(--o,1),minmax(0,1fr));grid-template-rows:minmax(0,1fr) 96px;grid-auto-rows:0}
  #grid.has-spot .tile.spot{grid-column:1/-1;grid-row:1}
  #grid.has-spot .tile:not(.spot){grid-column:auto;grid-row:2}
  #grid.has-spot .tile:not(.spot) .av{width:40px;font-size:1.1rem}
  #grid.has-spot .tile:not(.spot) .nm{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>

<main id="join">
  <div class="wrap">
    <div class="hero">
      <h1>با هر کسی، از هر جا، رو در رو حرف بزنید</h1>
      <p>یک نام برای اتاق انتخاب کنید و لینکش را بفرستید. بدون ثبت‌نام.</p>
      <div class="faces" aria-hidden="true"><i style="background:#2ec4b6">ن</i><i style="background:#ffb454">ر</i><i style="background:#ff8fa3">س</i><i style="background:#9b8cff">م</i></div>
    </div>
    <div class="card">
      <label for="name">نام شما</label>
      <input id="name" type="text" maxlength="30" autocomplete="nickname" placeholder="مثلاً سارا">
      <label for="room">نام اتاق</label>
      <input id="room" type="text" maxlength="40" dir="ltr" placeholder="my-room">
      <label class="check"><input id="audioOnly" type="checkbox"> فقط تماس صوتی، بدون تصویر</label>
      <button class="primary" id="go">ورود به اتاق</button>
      <div id="err" role="alert"></div>
    </div>
  </div>
</main>

<div id="app">
  <section id="stage">
    <div id="top">
      <div class="t"><span id="roomTitle"></span><span id="meta"></span></div>
      <button class="pill" id="copy" aria-label="کپی لینک اتاق"><svg class="ic"><use href="#i-link"/></svg><span id="copyTxt">کپی لینک</span></button>
    </div>
    <div id="grid" data-n="1"></div>
    <div id="bar">
      <button class="rb" id="mic" aria-label="میکروفون"><svg class="ic"><use href="#i-mic"/><path class="sl" d="M2 2l20 20"/></svg></button>
      <button class="rb" id="cam" aria-label="دوربین"><svg class="ic"><use href="#i-cam"/><path class="sl" d="M2 2l20 20"/></svg></button>
      <button class="rb" id="chatBtn" aria-label="چت"><svg class="ic"><use href="#i-chat"/></svg><span id="badge"></span></button>
      <button class="rb leave" id="leave" aria-label="ترک تماس"><svg class="ic"><use href="#i-phone"/></svg></button>
    </div>
  </section>
  <aside id="chat">
    <header><span>گفتگو</span><button id="closeChat" aria-label="بستن چت"><svg class="ic"><use href="#i-x"/></svg></button></header>
    <div id="msgs"><div class="empty" id="empty">هنوز پیامی نیست.<br>اولین پیام را بفرستید.</div></div>
    <form id="send">
      <input id="text" type="text" maxlength="2000" placeholder="پیام بنویسید" autocomplete="off">
      <button aria-label="ارسال"><svg class="ic"><use href="#i-send"/></svg></button>
    </form>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== Paste your Supabase values here (Project Settings > API) ======
const SUPABASE_URL = 'https://oeehbcttertgewkhfzes.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__6iqYESMfzjNeukvnh_Zww_THGAbnKB';
// =====================================================================
const MAX_PER_ROOM = 8;
const $ = (id) => document.getElementById(id);
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
// For strict networks add a TURN server above:
// { urls: 'turn:YOUR_SERVER:3478', username: '...', credential: '...' }

const myId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now();
let sb, ch, joined = false, local, myName, myRoom, unread = 0, spotId = null;
const pcs = {};
const COLORS = ['#2ec4b6', '#ffb454', '#ff8fa3', '#9b8cff', '#7bd88f', '#5bb8ff'];
const colorOf = (s) => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];

$('room').value = decodeURIComponent(location.hash.slice(1));
$('name').value = localStorage.getItem('cc-name') || '';

function applyZoom(t) {
  const z = +t.dataset.z || 1;
  t.querySelector('video').style.transform = (t.classList.contains('me') ? 'scaleX(-1) ' : '') + 'scale(' + z + ')';
}
function zoomBy(t, d) {
  t.dataset.z = Math.min(4, Math.max(0.5, (+t.dataset.z || 1) + d));
  applyZoom(t);
}
function setSpot(id) {
  const old = spotId;
  spotId = old === id ? null : id;
  const o = old && old !== spotId ? $('t-' + old) : null;
  if (o) { o.dataset.z = 1; o.querySelector('video').style.transformOrigin = 'center'; applyZoom(o); }
  layout();
}
function bindTile(t, id) {
  t.dataset.z = 1;
  t.querySelector('.tools').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'spot') { setSpot(id); return; }
    t.querySelector('video').style.transformOrigin = 'center';
    zoomBy(t, a === 'in' ? 0.25 : -0.25);
  };
  // Mouse wheel zooms toward the cursor; double-click resets
  t.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = t.getBoundingClientRect();
    t.querySelector('video').style.transformOrigin = ((e.clientX - r.left) / r.width * 100) + '% ' + ((e.clientY - r.top) / r.height * 100) + '%';
    zoomBy(t, e.deltaY < 0 ? 0.15 : -0.15);
  }, { passive: false });
  // Click a tile to focus it; the others become small thumbnails. Click again to go back.
  t.addEventListener('click', (e) => { if (!e.target.closest('.tools')) setSpot(id); });
}

function layout() {
  const g = $('grid'), n = g.children.length;
  g.dataset.n = n;
  if (spotId && !$('t-' + spotId)) spotId = null;
  g.classList.toggle('has-spot', !!spotId);
  [...g.children].forEach((c) => c.classList.toggle('spot', c.id === 't-' + spotId));
  g.style.setProperty('--o', Math.max(1, n - 1));
  const m = n === 2 ? 1 : n;
  let cols = m <= 1 ? 1 : m <= 4 ? 2 : 3;
  if (innerWidth < 760 && m >= 3) cols = 2;
  if (innerWidth >= 760 && m === 2) cols = 2;
  g.style.setProperty('--c', cols);
  $('meta').textContent = n + ' نفر در تماس';
}
addEventListener('resize', layout);

function tile(id, name, stream, isLocal) {
  let t = $('t-' + id);
  if (!t) {
    t = document.createElement('div');
    t.className = 'tile' + (isLocal ? ' me' : ''); t.id = 't-' + id;
    t.innerHTML = '<span class="av"></span><video autoplay playsinline></video><span class="nm"></span>'
      + '<div class="tools"><button data-a="in" aria-label="بزرگ‌نمایی"><svg class="ic"><use href="#i-zin"/></svg></button>'
      + '<button data-a="out" aria-label="کوچک‌نمایی"><svg class="ic"><use href="#i-zout"/></svg></button>'
      + '<button data-a="spot" aria-label="نمایش بزرگ"><svg class="ic"><use href="#i-max"/></svg></button></div>';
    bindTile(t, id);
    $('grid').appendChild(t);
  }
  const av = t.querySelector('.av');
  av.textContent = (name || '?').trim().charAt(0);
  av.style.background = colorOf(name || '?');
  t.querySelector('.nm').textContent = isLocal ? name + ' (شما)' : name;
  const v = t.querySelector('video');
  if (isLocal) v.muted = true;
  if (stream) { v.srcObject = stream; t.classList.toggle('hasvideo', stream.getVideoTracks().length > 0); }
  layout();
}

function makePC(id, name) {
  const pc = new RTCPeerConnection(ICE);
  pc.pending = [];
  pcs[id] = pc;
  local.getTracks().forEach((t) => pc.addTrack(t, local));
  pc.onicecandidate = (e) => e.candidate && sendSignal(id, { candidate: e.candidate });
  pc.ontrack = (e) => tile(id, name, e.streams[0]);
  return pc;
}

async function flush(pc) {
  while (pc.pending.length) { try { await pc.addIceCandidate(pc.pending.shift()); } catch {} }
}

function setChat(open) {
  $('app').classList.toggle('chat-open', open);
  if (open) { unread = 0; $('badge').style.display = 'none'; $('text').focus({ preventScroll: true }); }
}

function sendSignal(to, data) {
  ch.send({ type: 'broadcast', event: 'signal', payload: { from: myId, to, name: myName, data } });
}

async function call(id, name) {
  const pc = makePC(id, name);
  await pc.setLocalDescription(await pc.createOffer());
  sendSignal(id, { sdp: pc.localDescription });
}

async function onSignal({ from, to, name, data }) {
  if (to !== myId) return;
  let pc = pcs[from];
  if (data.sdp) {
    if (data.sdp.type === 'offer') {
      pc = pc || makePC(from, name);
      await pc.setRemoteDescription(data.sdp);
      await pc.setLocalDescription(await pc.createAnswer());
      sendSignal(from, { sdp: pc.localDescription });
    } else if (pc) {
      await pc.setRemoteDescription(data.sdp);
    }
    if (pc) flush(pc);
  } else if (data.candidate && pc) {
    if (pc.remoteDescription) { try { await pc.addIceCandidate(data.candidate); } catch {} }
    else pc.pending.push(data.candidate);
  }
}

function removePeer(id) {
  if (pcs[id]) { pcs[id].close(); delete pcs[id]; }
  const t = $('t-' + id); if (t) t.remove();
  layout();
}

function eventLine({ type, id, name, t }) {
  $('empty').style.display = 'none';
  const mine = id === myId;
  const d0 = new Date(t);
  const sameDay = d0.toDateString() === new Date().toDateString();
  const time = sameDay
    ? d0.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' })
    : d0.toLocaleString('fa-IR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const who = mine ? 'شما' : name;
  const verb = type === 'join' ? (mine ? 'وارد شدید' : 'وارد شد') : (mine ? 'خارج شدید' : 'خارج شد');
  const d = document.createElement('div');
  d.className = 'sys ' + type; d.dir = 'auto';
  d.textContent = who + ' ' + verb + '، ' + (sameDay ? 'ساعت ' : '') + time;
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

function showChat({ id, name, text }) {
  $('empty').style.display = 'none';
  const d = document.createElement('div');
  d.className = 'm' + (id === myId ? ' me' : '');
  d.dir = 'auto';
  const b = document.createElement('b'); b.textContent = name;
  d.append(b, document.createTextNode(text));
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
  if (id !== myId && !$('app').classList.contains('chat-open')) {
    unread++; $('badge').textContent = unread; $('badge').style.display = 'grid';
  }
}

// Saves a join/leave row in the database (keepalive lets it finish while the page closes)
function logEvent(type, keepalive) {
  return fetch(SUPABASE_URL + '/rest/v1/events', {
    method: 'POST', keepalive: !!keepalive,
    headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify({ room: myRoom, name: myName, type })
  }).catch(() => {});
}
addEventListener('pagehide', () => { if (joined) logEvent('leave', true); });

async function join() {
  myName = $('name').value.trim() || 'مهمان';
  myRoom = $('room').value.trim();
  if (!myRoom) { $('err').textContent = 'نام اتاق را وارد کنید.'; return; }
  if (SUPABASE_URL.includes('PASTE') || SUPABASE_ANON_KEY.includes('PASTE')) {
    $('err').textContent = 'آدرس و کلید Supabase هنوز در فایل وارد نشده است.'; return;
  }
  if (!window.isSecureContext || !navigator.mediaDevices) {
    $('err').textContent = 'دوربین و میکروفون فقط روی HTTPS یا آدرس localhost کار می‌کنند. آدرس فعلی: ' + location.origin;
    return;
  }
  if (typeof supabase === 'undefined') {
    $('err').textContent = 'کتابخانه Supabase بارگذاری نشد (احتمالاً cdn.jsdelivr.net در دسترس نیست). اینترنت یا فیلترشکن را بررسی کنید.';
    return;
  }
  $('err').textContent = '';
  try {
    local = await navigator.mediaDevices.getUserMedia({ audio: true, video: !$('audioOnly').checked });
  } catch (e) {
    $('err').textContent = 'دسترسی به میکروفون یا دوربین ممکن نشد. اجازه دسترسی را در مرورگر بدهید.';
    return;
  }
  localStorage.setItem('cc-name', myName);
  history.replaceState(null, '', '#' + encodeURIComponent(myRoom));

  $('err').style.color = '#9fd8d2'; $('err').textContent = 'در حال اتصال...'; $('go').disabled = true;
  let settled = false, timer;
  const fail = async (status) => {
    if (settled) return;
    settled = true; clearTimeout(timer);
    local.getTracks().forEach((t) => t.stop());
    let hint;
    try {
      const r = await fetch(SUPABASE_URL + '/rest/v1/', { headers: { apikey: SUPABASE_ANON_KEY } });
      hint = r.status < 500
        ? 'سرور Supabase در دسترس است؛ احتمالاً کلید اشتباه است یا اتصال WebSocket مسدود شده.'
        : 'پاسخ غیرعادی از Supabase (کد ' + r.status + ').';
    } catch { hint = 'به Supabase دسترسی ندارید (آدرس اشتباه است یا شبکه/فیلتر مانع می‌شود).'; }
    $('err').style.color = '';
    $('err').textContent = 'اتصال برقرار نشد (' + status + '). ' + hint;
    $('go').disabled = false;
    try { sb.removeChannel(ch); } catch {}
  };
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  ch = sb.channel('room:' + myRoom, { config: { broadcast: { self: true }, presence: { key: myId } } });
  let tracked = false, checked = false, ready = false;

  ch.on('broadcast', { event: 'signal' }, ({ payload }) => onSignal(payload));
  ch.on('broadcast', { event: 'chat' }, ({ payload }) => showChat(payload));

  // Presence = who is in the room. The peer with the larger id starts the call.
  ch.on('presence', { event: 'join' }, ({ key, newPresences }) => {
    if (key === myId) return;
    const name = (newPresences[0] && newPresences[0].name) || 'مهمان';
    if (ready) eventLine({ type: 'join', id: key, name, t: Date.now() });
    if (myId > key && !pcs[key]) call(key, name);
  });
  ch.on('presence', { event: 'leave' }, ({ key, leftPresences }) => {
    if (key === myId) return;
    removePeer(key);
    eventLine({ type: 'leave', id: key, name: (leftPresences[0] && leftPresences[0].name) || 'مهمان', t: Date.now() });
  });
  ch.on('presence', { event: 'sync' }, () => {
    if (!tracked || checked) return;
    checked = true;
    if (Object.keys(ch.presenceState()).length > MAX_PER_ROOM) {
      alert('ظرفیت این اتاق پر است.'); location.reload(); return;
    }
    ready = true; joined = true;
    eventLine({ type: 'join', id: myId, name: myName, t: Date.now() });
    logEvent('join');
  });

  timer = setTimeout(() => fail('timeout'), 12000);
  ch.subscribe(async (status) => {
    if (status !== 'SUBSCRIBED') {
      if (['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status)) fail(status);
      return;
    }
    settled = true; clearTimeout(timer);
    $('join').style.display = 'none';
    $('app').style.display = 'block';
    $('roomTitle').textContent = myRoom;
    tile('me', myName, local, true);
    if (innerWidth >= 760) setChat(true);
    // Earlier join/leave events of this room, from the database
    try {
      const { data } = await sb.from('events').select('type,name,created_at')
        .eq('room', myRoom).order('created_at', { ascending: false }).limit(30);
      (data || []).reverse().forEach((e) => eventLine({ type: e.type, id: '', name: e.name, t: Date.parse(e.created_at) }));
    } catch {}
    tracked = true;
    await ch.track({ name: myName });
  });
}

function toggle(btn, kind) {
  const tracks = kind === 'audio' ? local.getAudioTracks() : local.getVideoTracks();
  if (!tracks.length) { btn.disabled = true; btn.style.opacity = .4; return; }
  const on = !tracks[0].enabled;
  tracks.forEach((t) => (t.enabled = on));
  btn.classList.toggle('off', !on);
  if (kind === 'video') { const t = $('t-me'); if (t) t.classList.toggle('hasvideo', on); }
}

$('go').onclick = join;
[$('room'), $('name')].forEach((el) =>
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); })
);
$('mic').onclick = () => toggle($('mic'), 'audio');
$('cam').onclick = () => toggle($('cam'), 'video');
$('chatBtn').onclick = () => setChat(!$('app').classList.contains('chat-open'));
$('closeChat').onclick = () => setChat(false);
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $('copyTxt').textContent = 'کپی شد'; }
  catch { $('copyTxt').textContent = location.href; }
  setTimeout(() => ($('copyTxt').textContent = 'کپی لینک'), 2000);
};
$('leave').onclick = () => location.reload();
$('send').onsubmit = (e) => {
  e.preventDefault();
  const v = $('text').value.trim();
  if (v && ch) ch.send({ type: 'broadcast', event: 'chat', payload: { id: myId, name: myName, text: v.slice(0, 2000) } });
  $('text').value = '';
};
</script>
